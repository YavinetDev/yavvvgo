<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЯвьЕдет — прототип</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3nYV1O3g0iNQjzK8N8Qj9jz0M7lE=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root{--bg:#EEF3F8;--bg2:#E1E8F0;--card:#FFFFFF;--card2:#F3F6FA;--text:#0B1120;--mut:#53647A;--acc:#0E9F4B;--acc-ink:#FFFFFF;--line:#D3DCE6;--map:#E8EDF2;--halo:#FFFFFF;--amb:#B87800;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1120;--bg2:#070C17;--card:#16283F;--card2:#10203A;--text:#F4F7FA;--mut:#9FB0C2;--acc:#4FE3A0;--acc-ink:#0B1120;--line:#2A3E5A;--map:#0E1626;--halo:#0B1120;--amb:#F2B01E}}
:root[data-theme="dark"]{--bg:#0B1120;--bg2:#070C17;--card:#16283F;--card2:#10203A;--text:#F4F7FA;--mut:#9FB0C2;--acc:#4FE3A0;--acc-ink:#0B1120;--line:#2A3E5A;--map:#0E1626;--halo:#0B1120;--amb:#F2B01E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg2);color:var(--text);font-family:'Manrope',system-ui,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.screen{display:none;flex:1;min-height:0;flex-direction:column}.screen.on{display:flex}
.scroll{overflow-y:auto;padding:16px 16px 24px;gap:14px;display:flex;flex-direction:column}
.top{padding:10px 12px 8px;background:var(--bg);display:flex;flex-direction:column;gap:8px;z-index:3}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:34px;height:34px;border-radius:9px}.brand b{font-size:19px;font-weight:800}.brand small{color:var(--mut);font-weight:700;font-size:12px;margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.search{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:16px;outline:none}
.search:focus{border-color:var(--acc)}
#mapwrap{position:relative;flex:1;min-height:120px;background:var(--map);overflow:hidden}#tiles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;opacity:1}#tiles img{position:absolute;width:256px;height:256px;display:block}#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;z-index:1;background:transparent}.mc{z-index:4}.lp{z-index:6}.lg{z-index:4}#leafletMap{position:absolute;inset:0;z-index:0;display:none}.leaflet-control-container{z-index:3}
.mc{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mc button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px #0003}
.lp{position:absolute;right:58px;top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:none;flex-direction:column;gap:12px;font-weight:700;font-size:15px;box-shadow:0 4px 16px #0004;z-index:6}.lp.on{display:flex}.lp label{display:flex;gap:10px;align-items:center}.lp input{width:20px;height:20px;accent-color:var(--acc)}
.sr{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}.sr b{font-size:15px;line-height:1.25}.sr .en{font-weight:800;font-size:20px;color:var(--acc);white-space:nowrap;text-align:right}.sr small{display:block;color:var(--mut);font-size:12.5px;font-weight:600;line-height:1.4}
.lg{position:absolute;left:10px;bottom:8px;font-size:11px;font-weight:700;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 9px;display:flex;gap:10px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#sheet{background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -6px 20px #0003;display:flex;flex-direction:column;height:44%;min-height:0;z-index:4}
#sheet.big{height:62%}#sheet.min,#sheet.big.min{height:56px}#sheet.min .sb{display:none}
.grab{position:relative;padding:14px 16px 8px;display:flex;align-items:center;gap:10px;cursor:pointer;touch-action:none;min-height:46px}.grab i{position:absolute;top:6px;left:50%;margin-left:-22px;width:44px;height:5px;border-radius:3px;background:var(--line)}.grab span{flex:1;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grab em{font-style:normal;font-size:20px;color:var(--mut);font-weight:800}
.sb{overflow-y:auto;padding:0 14px 14px;flex:1;min-height:0}
.ri{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.badge{min-width:48px;height:34px;padding:0 8px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none}
.ri b{display:block;font-size:15px;line-height:1.25}.ri small{color:var(--mut);font-size:12.5px;font-weight:600}
.star{margin-left:auto;background:none;border:0;font-size:24px;cursor:pointer;color:var(--mut);padding:4px 6px}.star.on{color:#F2B01E}
.rd h3{margin:0;font-size:18px;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.meta span{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700}
.eta{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0}
.eta select{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px;font-size:14px;margin-bottom:8px}
.eta .n{font-size:34px;font-weight:800;color:var(--acc);line-height:1}.eta small{color:var(--mut);font-weight:600}
.sl{display:flex;flex-direction:column}.sl div{padding:8px 4px 8px 24px;position:relative;font-size:14px;font-weight:600;border-left:3px solid var(--rc);margin-left:8px;cursor:pointer}.sl div::before{content:"";position:absolute;left:-8px;top:13px;width:11px;height:11px;border-radius:50%;background:var(--card);border:3px solid var(--rc)}
.sl div.on{color:var(--acc);font-weight:800}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11.5px;font-weight:800;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:21px;line-height:1}.tabs button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h2{margin:0 0 6px;font-size:18px}.mut{color:var(--mut);font-size:13px;font-weight:600;line-height:1.4}
.hero{background:linear-gradient(135deg,#0E9F4B,#0B6F6B);color:#fff;border-radius:20px;padding:18px}.hero .big{font-size:42px;font-weight:800;line-height:1.05}.hero small{opacity:.9;font-weight:700}
.btn{border:0;background:var(--acc);color:var(--acc-ink);border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;cursor:pointer}.btn.g{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn:disabled{opacity:.45}
.trip{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.trip:last-child{border:0}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.lv{display:flex;flex-direction:column;gap:8px}.lv>div{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;font-size:13.5px;font-weight:700}.lv>div.on{border-color:var(--acc);background:var(--card2)}.lv b{min-width:112px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0}
.mod{position:absolute;inset:0;background:#000A;display:none;align-items:flex-end;z-index:20}.mod.on{display:flex}.mod>div{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
input[type=range]{width:100%;accent-color:var(--acc)}
#toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%;text-align:center}#toast.on{opacity:1}
h1.t{font-size:24px;margin:2px 0 0}
</style></head><body>

function openComp(i){const t=S.trips[i],mx=Math.min(bal(),Math.floor(t.f*.5)-t.k);$('#modc').innerHTML=`<h2 style="margin:0 0 4px">Компенсация поездки</h2><div class="mut">${D[t.c].name}, маршрут ${esc(t.n)} · ${t.f} ₽ · максимум ${mx} баллов (50% стоимости)</div><div style="font-size:40px;font-weight:800;color:var(--acc);margin:12px 0 2px"><span id="cv2">${mx}</span> ₽</div><div class="mut">вернём на карту «Тройка» •••• 4821</div><input type="range" id="rg" min="1" max="${mx}" value="${mx}" style="margin:14px 0"><div style="display:flex;gap:10px"><button class="btn g" style="flex:1" id="no">Отмена</button><button class="btn" style="flex:2" id="ok">Списать <span id="cv3">${mx}</span> баллов</button></div>`;$('#mod').classList.add('on');const rg=$('#rg');rg.oninput=()=>{$('#cv2').textContent=rg.value;$('#cv3').textContent=rg.value};$('#no').onclick=()=>$('#mod').classList.remove('on');
 $('#ok').onclick=()=>{let n=+rg.value;S.lots.sort((a,b)=>a.e.localeCompare(b.e));for(const l of S.lots){const u=Math.min(l.p,n);l.p-=u;n-=u}S.lots=S.lots.filter(l=>l.p>0);t.k+=+rg.value;save();$('#mod').classList.remove('on');renderPts();renderMe();toast('Вернули '+rg.value+' ₽ на карту за баллы')}}
$('#mod').addEventListener('click',e=>{if(e.target.id==='mod')$('#mod').classList.remove('on')});
// ---- cabinet
function renderMe(){const l=lvl(),t=14,nx=LV.find(x=>x.min>t),pr=nx?Math.min(100,(t-l.min)/(nx.min-l.min)*100):100;
 $('#mec').innerHTML=`<h1 class="t">Личный кабинет</h1><div class="card" style="display:flex;gap:14px;align-items:center"><div class="badge" style="width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-size:20px">ЯЕ</div><div><b style="font-size:18px">Пассажир ЯвьЕдет</b><div class="mut">+7 ••• ••• 48-21 · карта «Тройка» •••• 4821</div></div></div>
 <div class="card"><h2>Уровень «${l.n}»</h2><div class="mut">${t} поездок в этом месяце${nx?`, до уровня «${nx.n}» ещё ${nx.min-t}`:''}</div><div class="bar"><i style="width:${pr}%"></i></div><div class="lv">${LV.map(x=>`<div class="${x.n===l.n?'on':''}"><b>${x.n}</b><span>кэшбэк ${x.cb}%${x.w?` · ${x.w} поездок Whoosh в день`:''}</span></div>`).join('')}</div><div class="mut" style="margin-top:8px">Пороги по числу поездок условные: в томе 5 указан только диапазон от 0 до 60+ поездок в месяц.</div></div>
 <div class="card"><h2>Мои данные</h2><div class="row"><span>Избранных маршрутов</span><b>${S.fav.length}</b></div><div class="row"><span>Баланс баллов</span><b>${fmt(bal())}</b></div><div class="row"><span>Город по умолчанию</span><select id="dc" style="border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px">${CID.map(c=>`<option value="${c}" ${c===S.city?'selected':''}>${D[c].name}</option>`).join('')}</select></div><div class="row"><span>Тема</span><select id="th" style="border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px"><option value="auto" ${S.theme==='auto'?'selected':''}>Как в системе</option><option value="light" ${S.theme==='light'?'selected':''}>Светлая</option><option value="dark" ${S.theme==='dark'?'selected':''}>Тёмная</option></select></div><div class="row"><span>Уведомления об изменении трасс</span><input type="checkbox" id="nt" ${S.notif?'checked':''}></div></div>
 <button class="btn g" id="rs">Сбросить демо-данные</button><div class="mut">Это прототип: поездки, баланс и профиль придуманы, транспорт на карте движется по интервалам из проекта, а не по данным ГЛОНАСС.</div>`}
$('#mec').addEventListener('change',e=>{if(e.target.id==='dc'){S.city=e.target.value;save();setCity(S.city)}if(e.target.id==='th'){S.theme=e.target.value;applyTheme();save()}if(e.target.id==='nt'){S.notif=e.target.checked;save()}});
$('#mec').addEventListener('click',e=>{if(e.target.id==='rs'){S.lots=defLots();S.trips=defTrips();S.fav=[];save();renderAll();toast('Демо-данные сброшены')}});
function applyTheme(){const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);dirty=true}
function tab(t){S.tab=t;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+t));document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(t==='fav')renderFav();if(t==='pts')renderPts();if(t==='me')renderMe();if(t==='map')setTimeout(()=>{resize()},30)}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b)tab(b.dataset.t)};
$('#lay').onclick=()=>$('#lp').classList.toggle('on');$('#ld').checked=LAY.d;$('#lo').checked=LAY.o;$('#ld').onchange=e=>{LAY.d=e.target.checked;st.set('layers',LAY);updLegend();dirty=true};$('#lo').onchange=e=>{LAY.o=e.target.checked;st.set('layers',LAY);updLegend();dirty=true};
function renderAll(){updLegend();renderChips();renderSheet();renderFav();renderPts();renderMe()}
new ResizeObserver(()=>{const first=!W;resize();if(first)fitCity()}).observe(cv);
if(!CID.includes(S.city))S.city='msk';applyTheme();city(S.city);renderAll();requestAnimationFrame(loop);
})();
</script></body></html>
